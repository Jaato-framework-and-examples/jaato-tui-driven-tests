name: manual_writer
description: >-
  Reads a TUI scene capture from its initial prompt and emits a typed
  documentation payload.  A reactor renders the markdown.  Single-shot
  (max_turns=1) — body-wired determinism stack.
model: openai/gpt-oss-20b:free
provider: openrouter
max_turns: 6
# Same rationale as the documenter profile: this agent operates in
# a tight closed loop (read scene → readFile → updateFile →
# signal_completion).  The general-purpose behavioral principles
# don't apply and inflate the prompt unnecessarily.
suppress_base_instructions: true
gc:
  type: budget
  threshold_percent: 80.0
  target_percent: 60.0
  pressure_percent: 0
  preserve_recent_turns: 3
  notify_on_gc: false
plugins:
- file_edit(preload)
completion_payload_schema: completion_schemas/manual_writer.json
plugin_configs:
  openrouter:
    # api_key not set here — JAATO_OPENROUTER_API_KEY in the workspace .env
    # (resolved via pass://) is the canonical source.  Server 0.6.74
    # made .env values pass through expand_variables so secret URIs
    # work there too.
    api_params:
      temperature: 0.0
      # OpenRouter prompt-caching (server 0.6.74+).  openai/gpt-oss-*
      # uses upstream auto-caching, so this knob mostly enables
      # response-side usage parsing (cache_read_tokens visibility).
      cache_prompt: true
      cache_ttl: "5m"
  permission:
    policy:
      defaultPolicy: allow
      # introspection is the ONLY plugin force-added regardless of
      # profile.plugins (per shared/jaato_runtime.py:_get_essential_plugins
      # — needed for deferred-tool-loading machinery).  We don't want the
      # agent calling discovery tools — schema arrives with the tool
      # definition, and prefetch carries the rest — so blacklist its two
      # exposed tools.  All other tools the agent shouldn't see (todo,
      # subagent, references, memory, etc.) are excluded by simply not
      # listing those plugins in profile.plugins above.
      blacklist:
        tools:
          - list_tools
          - get_tool_schemas
        patterns: []
runtime_limits:
  tool_timeout_seconds: 30
  memory_max_mb: 256
  max_output_bytes: 65536
env: {}
