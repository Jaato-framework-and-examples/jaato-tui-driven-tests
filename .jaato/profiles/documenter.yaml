name: documenter
description: >-
  Autonomous TUI documenter — given a high-level brief for ONE feature,
  drives the running TUI via tmux (cli plugin), observes the result,
  then writes / updates the manual section file directly via file_edit.
  Companion to manual_writer (which receives a pre-captured scene).
model: openai/gpt-oss-20b:free
provider: openrouter
max_turns: 30
# The harness's documenter operates in a closed loop (drive TUI →
# capture scene → write chapter → signal_completion).  The
# user-tier / premium-tier behavioral principles
# (Transparency Mandate, Need-to-Know Context Sharing,
# Subagent Selection, etc.) are designed for general-purpose
# multi-step workflows; they don't apply here and inflate the
# system prompt by ~48 KB which slows reasoning + drives drift.
# Suppress them to keep the prompt focused on the documenter's
# persona + cross-persona TUI rules from `.jaato/instructions/`.
suppress_base_instructions: true
gc:
  type: budget
  threshold_percent: 80.0
  target_percent: 60.0
  pressure_percent: 0
  preserve_recent_turns: 5
  notify_on_gc: false
plugins:
  # cli is preloaded — the documenter calls tmux capture-pane / send-keys
  # via cli for every TUI interaction.  No fallback.
  - cli(preload)
  # file_edit is preloaded — the chapter is written via writeNewFile or
  # updateFile.  No fallback.
  - file_edit(preload)
completion_payload_schema: completion_schemas/manual_writer.json
plugin_configs:
  openrouter:
    api_params:
      temperature: 0.0
      # Exercise OpenRouter prompt-caching (server 0.6.74+):
      # openai/gpt-oss-* uses upstream auto-caching, so explicit
      # cache_control breakpoints aren't stamped (the model is not
      # in EXPLICIT_CACHE_MODEL_HINTS).  Setting cache_prompt: true
      # still enables response-side usage parsing so the daemon
      # ledger sees cache_read_tokens / cache_creation_tokens on
      # subsequent turns of the same session.
      cache_prompt: true
      cache_ttl: "5m"
  permission:
    policy:
      defaultPolicy: allow
      blacklist:
        tools:
          - list_tools
          - get_tool_schemas
        patterns: []
runtime_limits:
  tool_timeout_seconds: 30
  memory_max_mb: 256
  max_output_bytes: 65536
env: {}
