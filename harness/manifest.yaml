# Walkthrough feature manifest — small first-cut scope.
#
# Schema per feature:
#
#   id:              stable identifier; used as the .md filename suffix
#                    (manual/20-walkthrough-<id>.md) and the
#                    Observation.source_feature on discovered facts.
#                    snake-case, no spaces.
#   title:           human-readable section heading.
#   pre_setup:       (optional) steps to run BEFORE the trigger.  Same
#                    step grammar as `trigger`.
#   trigger:         steps that demonstrate the feature.  Each step is
#                    one of:
#                      send: <text-or-special-key>
#                      send_raw: <text>      (no two-step + Enter dance)
#                      wait_for: <substring> (poll capture-pane)
#                      sleep: <seconds>
#   capture:
#     history: <int>            scrollback lines to include (0 = visible only)
#     crop_anchors:             optional; trim capture to a region
#       from_line_matching: <regex>
#       to_line_matching:   <regex>
#   cleanup:         (optional) steps to return TUI to baseline state
#                    after capture.  Runs even on failure of trigger
#                    (try/finally semantics in walker).

features:
  - id: initial-banner
    title: "Initial TUI state — banner + prompt"
    # No trigger; the launch_tui hook waits for "User>" before this
    # feature's capture, so the banner is fully drawn.
    trigger:
      - sleep: 0.5
    capture:
      history: 0

  - id: ctrl-b-budget-panel
    title: "Ctrl+B — Budget panel (token usage by category)"
    trigger:
      - send: "C-b"
      - wait_for: "Token Usage"
      - sleep: 1
    capture:
      history: 0
    cleanup:
      # Ctrl+B is the unambiguous toggle.  ``Escape`` would do
      # ``drill_up()`` first (per pt_display.py:handle_budget_escape) and
      # only close the panel when already at top level — fragile if
      # the panel happens to be drilled down.  Ctrl+B always toggles
      # the panel off regardless of drill state.
      - send: "C-b"
      - sleep: 0.5

  - id: exit-menu
    title: "`exit` command — Detach / end-session menu"
    # Brief settle delay so the previous feature's panel cleanup
    # finishes redrawing before we send the ``exit`` command —
    # otherwise the keystrokes can land in the input box BEHIND a
    # not-yet-dismissed panel and never reach the command parser.
    pre_setup:
      - sleep: 1
    trigger:
      - send: "exit"
      # The exit menu's distinctive bottom-of-prompt anchor.  More
      # reliable than ``"Exit options:"`` (header-style — wrappable)
      # — ``Choice [`` is the Y/N-style prompt the TUI sets, always
      # visible on its own line.
      - wait_for: "Choice ["
      - sleep: 0.5
    capture:
      history: 0
    cleanup:
      # 'r' = return to session (dismisses the menu without ending).
      # ``send`` (not ``send_raw``) so the two-step text+Enter sequence
      # fires — the Choice prompt waits for Enter to commit the answer
      # rather than auto-submitting on the first keystroke.
      - send: "r"
      - wait_for: "User>"
